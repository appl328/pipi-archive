<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#657052"><meta name="description" content="사진 한 장, 짧은 한마디. 피피의 작은 사진첩"><title>PIPI ARCHIVE</title><link rel="icon" href="assets/favicon.png"><link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="PIPI ARCHIVE"><link rel="stylesheet" href="style.css"></head>
<body data-theme="letter"><main><aside><div class="brand">PIPI ARCHIVE</div><div class="intro"><span class="eyebrow">A LITTLE COLLECTION OF US</span><h1>피피의<br>작은 사진첩</h1><p>사진 한 장, 짧은 한마디<br>차곡차곡 모아둔 피피의 하루</p></div><div class="aside-bottom"><span class="issue"></span><p>오래 간직하고 싶은 순간들</p></div></aside>
<section class="album"><header><div><span class="eyebrow">OUR EVERYDAY MOMENTS</span><h2><b id="month-title"></b> <span id="entry-total">0</span></h2></div><button id="add" class="primary" disabled>＋ 기록 넣기</button></header><div class="subline"><span>피피가 남긴 사진과 문자</span><span id="month-label"></span></div><div id="grid" class="grid" aria-live="polite"><p>사진첩 여는 중</p></div><footer><div class="pagination"><button id="prev" aria-label="이전 페이지">←</button><span id="page"></span><button id="next" aria-label="다음 페이지">→</button></div></footer><div class="storage"><div><button id="export" disabled>백업 내보내기</button><button id="import" disabled>백업 가져오기</button><input id="backup-file" type="file" accept=".json,application/json" hidden></div></div></section></main>
<dialog id="viewer"><button class="close" aria-label="닫기">×</button><div class="viewer-content"><img id="large" alt="피피 사진"><div class="message"><span class="eyebrow">FROM. PIPI</span><p id="message"></p><label>기록한 날짜<input id="date" type="date" required></label><div class="viewer-nav"><button id="back" aria-label="이전 사진">←</button><span id="count"></span><button id="forward" aria-label="다음 사진">→</button></div><small>사진을 좌우로 밀어 다음 기록 보기</small><div class="record-actions"><button id="edit">문자 수정</button><button id="delete-entry" class="delete-entry">이 기록 삭제</button></div></div></div></dialog>
<dialog id="composer"><form><h2 id="form-title">새로운 피피의 하루</h2><label id="photo-label">정방형 사진<input id="upload" type="file" accept="image/png,image/jpeg,image/webp,image/gif" required></label><label>피피가 보낸 문자<textarea id="new-message" maxlength="10000" placeholder="사진과 함께 온 한마디"></textarea></label><label>날짜<input id="new-date" type="date" required></label><p id="form-error" role="alert"></p><div class="form-actions"><button type="button" id="cancel">취소</button><button id="save" class="primary">저장</button></div></form></dialog>
<dialog id="restore"><h2>백업 가져오기</h2><p id="restore-summary"></p><p>현재 기록에 합쳐서 가져옴<br>같은 ID의 기록은 현재 내용을 유지함</p><div class="form-actions"><button id="restore-cancel">취소</button><button id="restore-confirm" class="primary">가져오기</button></div></dialog>
<div id="status" role="status" hidden><span></span><button id="undo" hidden>삭제 되돌리기</button><button id="dismiss" aria-label="알림 닫기">×</button></div><script src="app.js"></script></body></html>
